name: CI

on:
  push:
  pull_request:

jobs:
  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check i18n and build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Compile backend
        run: uv run python -m compileall -q main.py agent/agent_loop.py
      - name: Check backend CLI entry
        run: |
          set -o pipefail
          if ! uv run python main.py --help; then
            echo "::error title=Backend CLI check failed::Run 'uv sync', verify main.py argument parsing, and confirm dependencies imported in main startup are available."
            echo "Troubleshoot:"
            echo "1) Run 'uv sync' and retry."
            echo "2) Check main.py startup import errors."
            echo "3) Check new CLI options are registered with defaults."
            exit 1
          fi
