<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NGY Agent Web Admin</title>
    <script>
      // Resolve the skin before the first paint: React mounts later and would
      // otherwise flash the fallback (dark) theme on a light-mode machine.
      (function () {
        var fallback = "dark"
        try {
          var stored = window.localStorage.getItem("web-admin.theme")
          if (stored === "light" || stored === "dark") {
            fallback = stored
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            fallback = "light"
          }
        } catch (error) {
          fallback = "dark"
        }
        document.documentElement.setAttribute("data-theme", fallback)
        document.documentElement.style.colorScheme = fallback
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
