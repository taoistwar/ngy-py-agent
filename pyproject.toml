[project]
name = "ngy-py-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
    "accelerate>=0.25.0",
    "charset-normalizer>=3.0.0",
    "fastapi>=0.104.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "pydantic[email,timezone]>=2.0.0",
    "pypdf2>=3.0.0",
    "python-dotenv>=1.0.0",
    "python-weather>=2.0.0",
    "requests>=2.31.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers>=4.36.0",
    "uvicorn>=0.24.0",
    "dotenv>=0.9.9",
    "tiktoken>=0.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
